<meta property="og:description" content="50 dark synths · melody + 808 drum generator · VST3 / AU for Windows & Mac · $9.99">

<link rel="apple-touch-icon" href="assets/icon-192.png">

<style>
:root {
  --bg: #040509;
  --panel: rgba(9, 11, 18, 0.88);
  --line: #1a1f2e;
  --text: #c3c9e0;
  --dim: #6c7290;
  --white: #f2f4ff;
  --drift: #8fa2ff;
  --astral: #8fe3ff;
  --void: #a49ac4;
  --spirit: #d4a8ff;
  --signal: #ff6a7a;
  --accent: var(--astral);
  --gutter: 20px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 400 15px/1.65 "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  overflow-x: hidden;
}
::selection { background: var(--accent); color: var(--bg); }
a { color: var(--white); }
img { max-width: 100%; display: block; }
.pixelated { image-rendering: pixelated; image-rendering: crisp-edges; }

#web { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; image-rendering: pixelated; image-rendering: crisp-edges; opacity: .8; }
.page { position: relative; z-index: 1; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 var(--gutter); }

/* pixel text built from the plugin's own 5x7 font */
.px { display: block; height: calc(var(--s, 4px) * 7); width: auto; overflow: visible; }
.px rect { shape-rendering: crispEdges; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* stepped pixel corners */
.step { clip-path: polygon(4px 0, calc(100% - 4px) 0, calc(100% - 4px) 4px, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 4px calc(100% - 4px), 0 calc(100% - 4px), 0 4px, 4px 4px); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 12px;
  padding: 16px 26px; min-height: 52px;
  background: var(--accent); color: #05060a;
  text-decoration: none; border: 0; cursor: pointer; font: inherit;
  transition: background .12s steps(2), transform .12s steps(2);
}
.btn:hover { background: var(--white); }
.btn:active { transform: translateY(2px); }
.btn:focus-visible, .ghost:focus-visible, .play:focus-visible, .lang button:focus-visible, summary:focus-visible { outline: 2px solid var(--white); outline-offset: 3px; }
.btn.soon { background: #2a3044; color: var(--text); }
.btn .px { --s: 3px; }
.btn.big .px { --s: 4px; }
.ghost {
  display: inline-flex; align-items: center; gap: 10px; padding: 14px 18px; min-height: 52px;
  color: var(--text); text-decoration: none; border: 2px solid var(--line); background: rgba(4,5,9,.6);
}
.ghost:hover { border-color: var(--accent); color: var(--white); }
.ghost .px { --s: 3px; }

/* header */
header.top {
  position: fixed; top: 0; left: 0; right: 0; z-index: 20;
  background: rgba(4, 5, 9, 0.9); border-bottom: 1px solid var(--line);
}
header.top .wrap { display: flex; align-items: center; justify-content: space-between; height: 58px; gap: 12px; }
header.top .logo { color: var(--white); text-decoration: none; }
header.top .logo .px { --s: 3px; }
.right { display: flex; align-items: center; gap: 10px; }
.lang { display: flex; border: 1px solid var(--line); }
.lang button { background: none; border: 0; color: var(--dim); font: inherit; font-size: 12px; padding: 6px 9px; cursor: pointer; min-width: 36px; min-height: 32px; }
.lang button[aria-pressed="true"] { background: var(--line); color: var(--white); }
header.top .btn { padding: 9px 14px; min-height: 38px; }
@media (max-width: 520px) { header.top .btn { display: none; } }

/* hero */
.hero { padding: 108px 0 56px; }
.hero .wrap { display: grid; grid-template-columns: 1.15fr .85fr; gap: 48px; align-items: center; }
.wordmark { color: var(--white); width: min(100%, 540px); }
.wordmark svg { width: 100%; height: auto; display: block; }
.tagline { margin: 26px 0 0; color: var(--accent); }
.tagline .px { height: auto; width: min(100%, 520px); }
.lead { font-size: 17px; color: var(--text); max-width: 34em; margin: 22px 0 0; }
.lead b { color: var(--white); font-weight: 600; }
.cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; align-items: center; }
.note { color: var(--dim); font-size: 13px; margin-top: 14px; }
.badges { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
.launch { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-top: 24px; padding: 12px 14px; border: 1px dashed var(--accent); background: rgba(4,5,9,.7); max-width: 34em; }
.launch[hidden] { display: none; }
.launch .tag { color: var(--bg); background: var(--accent); padding: 6px 8px; }
.launch .tag .px { --s: 2px; }
.launch .ltxt { font-size: 13px; color: var(--text); }
.launch s { color: var(--dim); }
.launch b { color: var(--white); }
.final .launch { margin: 28px auto 0; justify-content: center; }
.pays { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px; font-size: 12px; }
.pays .lbl { color: var(--dim); margin-right: 2px; }
.pay { border: 1px solid var(--accent); color: var(--white); padding: 5px 10px; background: rgba(4,5,9,.6); white-space: nowrap; }
.final .pays { justify-content: center; }
.badge { border: 1px solid var(--line); padding: 5px 9px; color: var(--dim); font-size: 12px; background: rgba(4,5,9,.6); }

.phone { justify-self: center; width: min(340px, 100%); position: relative; }
.phone .screen {
  position: relative; aspect-ratio: 9 / 16; background: #000; overflow: hidden;
  border: 2px solid var(--accent);
  box-shadow: 0 0 0 4px var(--bg), 0 0 0 6px rgba(143,227,255,.35), 0 0 0 10px var(--bg), 0 0 0 12px rgba(143,227,255,.14);
}
.phone video { width: 100%; height: 100%; object-fit: cover; display: block; }
.sound {
  position: absolute; left: 12px; bottom: 12px; z-index: 2;
  display: inline-flex; align-items: center; gap: 8px; padding: 10px 12px; min-height: 40px;
  background: rgba(4,5,9,.85); color: var(--white); border: 1px solid var(--accent); cursor: pointer; font: inherit; font-size: 12px;
}
.sound .px { --s: 2px; }

/* sections */
section { padding: 72px 0; scroll-margin-top: 58px; }
.head { margin-bottom: 30px; }
.kicker { color: var(--dim); font-size: 12px; letter-spacing: .12em; margin-bottom: 12px; }
.head .px { --s: 5px; color: var(--white); }
.head .bar { width: 64px; height: 4px; background: var(--accent); margin-top: 16px; }
.head p { max-width: 40em; margin: 18px 0 0; }

.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); transition: border-color .15s steps(2), box-shadow .15s steps(2); }
.card.on { border-color: var(--t); box-shadow: 0 0 0 2px var(--t); }
.card img { width: 100%; aspect-ratio: 480 / 300; }
.card .body { padding: 14px 16px 16px; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; }
.card .name { color: var(--t); }
.card .name .px { --s: 3px; }
.card .patch { color: var(--dim); font-size: 12px; grid-column: 1; }
.card .desc { grid-column: 1 / -1; font-size: 14px; margin: 4px 0 0; }
.play {
  grid-column: 2; grid-row: 1 / span 2; width: 48px; height: 48px;
  display: grid; place-items: center; background: var(--t); color: #05060a; border: 0; cursor: pointer;
}
.play:hover { background: var(--white); }
.play .px { --s: 3px; }
.meter { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; margin-top: 8px; height: 6px; }
.meter i { background: #1a1f2e; }
.meter i.lit { background: var(--t); }

.split { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: center; }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; }
.list li { display: grid; grid-template-columns: 112px 1fr; gap: 14px; align-items: baseline; }
.list .k { color: var(--accent); }
.list .k .px { --s: 2px; }
.crop {
  width: 100%; aspect-ratio: 228 / 90;
  background-image: url(assets/shots/beat.png); background-repeat: no-repeat;
  background-size: calc(100% * 480 / 228) auto;
  background-position: 99.2% 100%;
  image-rendering: pixelated; image-rendering: crisp-edges;
  border: 2px solid var(--accent);
  box-shadow: 0 0 0 4px var(--bg), 0 0 0 6px rgba(143,227,255,.3);
}
.cap { color: var(--dim); font-size: 12px; margin-top: 14px; }

.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.tile { background: var(--panel); border: 1px solid var(--line); padding: 20px; }
.tile .px { --s: 3px; color: var(--white); }
.tile .bar { width: 28px; height: 3px; background: var(--t, var(--accent)); margin: 12px 0 10px; }
.tile p { margin: 0; font-size: 14px; }

.shot { border: 2px solid var(--line); background: #000; }
.shot img { width: 100%; }

.specs { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.spec { background: var(--panel); border: 1px solid var(--line); padding: 22px; }
.spec .px { --s: 3px; color: var(--white); margin-bottom: 14px; }
.spec ul { margin: 0; padding-left: 18px; }
.box { margin-top: 16px; background: var(--panel); border: 1px dashed var(--line); padding: 18px 22px; }

details { border-top: 1px solid var(--line); }
details:last-of-type { border-bottom: 1px solid var(--line); }
summary { cursor: pointer; list-style: none; padding: 18px 4px; display: flex; gap: 14px; align-items: center; color: var(--white); font-weight: 600; }
summary::-webkit-details-marker { display: none; }
summary .px { --s: 2px; color: var(--accent); flex: none; transition: transform .15s steps(2); }
details[open] summary .px { transform: rotate(45deg); }
details p { margin: 0 4px 20px 30px; max-width: 46em; }

.final { text-align: center; padding: 96px 0 120px; }
.final .wordmark { margin: 0 auto; width: min(100%, 360px); }
.final .cta { justify-content: center; }
.final .lineup { margin: 26px auto 0; color: var(--accent); width: min(100%, 420px); }
.final .lineup .px { width: 100%; height: auto; }

footer { border-top: 1px solid var(--line); padding: 26px 0 120px; color: var(--dim); font-size: 12px; }
footer p { margin: 4px 0; }

.stick {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  padding: 10px var(--gutter) calc(10px + env(safe-area-inset-bottom));
  background: #05060a; border-top: 2px solid var(--accent);
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  transform: translateY(110%); transition: transform .2s steps(4);
}
.stick.show { transform: none; }
.stick .px { --s: 3px; color: var(--white); }
.stick .btn { padding: 12px 18px; min-height: 46px; }
@media (min-width: 900px) { .stick { display: none; } }

.toast {
  position: fixed; left: 50%; top: 76px; transform: translateX(-50%); z-index: 40;
  background: var(--bg); border: 2px solid var(--accent); color: var(--white); padding: 12px 16px; font-size: 13px;
  opacity: 0; pointer-events: none; transition: opacity .15s steps(2); max-width: calc(100vw - 32px);
}
.toast.show { opacity: 1; }

@media (max-width: 960px) {
  .cards, .grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 900px) {
  .hero .wrap, .split, .specs { grid-template-columns: 1fr; }
  .hero { padding-top: 92px; }
  .hero .wrap { gap: 40px; }
}
@media (max-width: 620px) {
  :root { --gutter: 16px; }
  body { font-size: 14px; }
  .cards, .grid { grid-template-columns: 1fr; }
  .lead { font-size: 15px; }
  section { padding: 56px 0; }
  .head .px { --s: 4px; }
  .list li { grid-template-columns: 1fr; gap: 4px; }
  .btn.big { width: 100%; }
  .cta .ghost { width: 100%; justify-content: center; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
}
</style>
</head>

<script>
// ---------------------------------------------------------------------------------------------
// Paste the Gumroad product link here, e.g. "https://yourname.gumroad.com/l/voidweb"
const BUY_URL = "https://sashahristenko.gumroad.com/l/voidweb?wanted=true";
const PRICE = "$9.99";
// Launch week: the LAUNCH code (-30%) is applied by the link itself; the site switches back on its own afterwards.
const LAUNCH = { url: "https://sashahristenko.gumroad.com/l/voidweb/LAUNCH?wanted=true", price: "$6.99", ends: Date.parse("2026-11-16T07:59:00Z") };

/** Turns text into an SVG of the plugin's 5x7 pixel font (2 = glyph gap). */
function pixelSvg(text, glow) {
  const chars = [...text.toUpperCase()];
  const w = Math.max(1, chars.length * 6 - 1), h = 7;
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", glow ? `-1 -1 ${w + 2} ${h + 2}` : `0 0 ${w} ${h}`);
  svg.setAttribute("class", "px");
  svg.setAttribute("aria-hidden", "true");
  svg.setAttribute("focusable", "false");
  const runs = [];
  chars.forEach((c, i) => {
    const g = FONT[c];
    if (!g) return;
    for (let r = 0; r < 7; r++) {
      let start = -1;
      for (let b = 0; b <= 5; b++) {
        const on = b < 5 && (g[r] >> (4 - b)) & 1;
        if (on && start < 0) start = b;
        if (!on && start >= 0) { runs.push([i * 6 + start, r, b - start]); start = -1; }
      }
    }
  });
  if (glow) {
    const gl = document.createElementNS(ns, "g");
    gl.setAttribute("fill", "var(--accent)");
    gl.setAttribute("opacity", "0.38");
    for (const [x, y, len] of runs) {
      const rc = document.createElementNS(ns, "rect");
      rc.setAttribute("x", x - 0.5); rc.setAttribute("y", y - 0.5);
      rc.setAttribute("width", len + 1); rc.setAttribute("height", 2);
      gl.appendChild(rc);
    }
    svg.appendChild(gl);
  }
  const g = document.createElementNS(ns, "g");
  g.setAttribute("fill", "currentColor");
  for (const [x, y, len] of runs) {
    const rc = document.createElementNS(ns, "rect");
    rc.setAttribute("x", x); rc.setAttribute("y", y); rc.setAttribute("width", len); rc.setAttribute("height", 1);
    g.appendChild(rc);
  }
  svg.appendChild(g);
  if (glow) { svg.style.height = "auto"; svg.style.width = "100%"; }
  return svg;
}

function renderPixels(root = document) {
  root.querySelectorAll("[data-px]").forEach(el => {
    const text = el.getAttribute("data-px");
    const svg = pixelSvg(text, el.hasAttribute("data-glow"));
    el.replaceChildren(svg);
    if (!el.closest("[aria-hidden='true']") && !el.closest("button") && !el.closest("a")) {
      const s = document.createElement("span");
      s.className = "sr";
      s.textContent = text;
      el.appendChild(s);
    }
    if (el.closest("a, button") && !el.closest("a, button").hasAttribute("aria-label")) {
      el.closest("a, button").setAttribute("aria-label", text.replace(/[▶■]/g, "").trim());
    }
  });
}

// audio: demos and the reel drive the web through one analyser
let ac = null, analyser = null, timeData = null;
const sources = new WeakMap();
function ensureAudio() {
  if (ac) { if (ac.state === "suspended") ac.resume(); return; }
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    analyser = ac.createAnalyser();
    analyser.fftSize = 1024;
    timeData = new Uint8Array(analyser.fftSize);
    analyser.connect(ac.destination);
  } catch (e) { ac = null; }
}
function route(media) {
  if (!ac || sources.has(media)) return;
  try { const s = ac.createMediaElementSource(media); s.connect(analyser); sources.set(media, s); } catch (e) {}
}
function audioLevel() {
  if (!analyser) return 0;
  analyser.getByteTimeDomainData(timeData);
  let sum = 0;
  for (let i = 0; i < timeData.length; i++) { const v = (timeData[i] - 128) / 128; sum += v * v; }
  return Math.sqrt(sum / timeData.length);
}

const players = {};
let current = null;
const reel = document.getElementById("reel");
const soundBtn = document.getElementById("soundBtn");

function stopDemo() {
  if (!current) return;
  const { audio, card } = current;
  audio.pause();
  audio.currentTime = 0;
  card.classList.remove("on");
  card.querySelector(".play").replaceChildren(pixelSvg("▶"));
  card.querySelectorAll(".meter i").forEach(i => i.classList.remove("lit"));
  current = null;
  setTint(defaultTint);
}

function wireDemos() {
  document.querySelectorAll(".card").forEach(card => {
    const id = card.dataset.demo;
    const d = DEMOS.find(x => x.id === id);
    card.querySelector(".play").addEventListener("click", () => {
      if (current && current.id === id) { stopDemo(); return; }
      stopDemo();
      setReelSound(false);
      ensureAudio();
      let audio = players[id];
      if (!audio) {
        audio = new Audio(`assets/demos/${id}.m4a`);
        audio.preload = "auto";
        players[id] = audio;
        audio.addEventListener("ended", () => { if (current && current.audio === audio) stopDemo(); });
      }
      route(audio);
      audio.currentTime = 0;
      audio.play().catch(() => {});
      current = { id, audio, card };
      card.classList.add("on");
      card.querySelector(".play").replaceChildren(pixelSvg("■"));
      setTint(d.tint);
      burst(0.5);
    });
  });
}

function setReelSound(on) {
  if (on) {
    stopDemo();
    ensureAudio();
    route(reel);
    reel.muted = false;
    if (reel.paused) reel.play().catch(() => {});
  } else {
    reel.muted = true;
  }
  soundBtn.setAttribute("aria-pressed", String(on));
  soundBtn.setAttribute("aria-label", on ? "Mute video" : "Video sound on");
  soundBtn.replaceChildren(pixelSvg(on ? "■ MUTE" : "▶ SOUND"));
}
soundBtn.addEventListener("click", () => setReelSound(reel.muted));

function tickMeters() {
  if (current) {
    const { audio, card } = current;
    const p = audio.duration ? audio.currentTime / audio.duration : 0;
    const lit = Math.round(p * 24);
    card.querySelectorAll(".meter i").forEach((i, k) => i.classList.toggle("lit", k < lit));
  }
}

const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16);
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const defaultTint = "#8fe3ff";
let tint = hex(defaultTint), tintTo = tint.slice(), ramp = [];
let S = 4, bw = 0, bh = 0, img = null, glow = null, neb = null, nodes = [], stars = [], time = 0, level = 0;

function setTint(h) { tintTo = hex(h); }
function makeRamp() {
  const base = [4, 5, 9];
  ramp = [];
  for (let k = 0; k < 8; k++) {
    const u = k / 7;
    let c;
    if (u <= 0.72) { const t = u / 0.72; c = base.map((v, i) => v + (tint[i] * 0.85 - v) * t * t); }
    else { const t = (u - 0.72) / 0.28; c = tint.map(v => v * 0.85 + (255 - v * 0.85) * t * 0.85); }
    ramp.push(c.map(Math.round));
  }
}
function node(x, y, e, life) { return { x, y, vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6, e, life }; }
function resize() {
  S = innerWidth < 700 ? 3 : 4;
  bw = Math.max(8, Math.ceil((innerWidth || 800) / S));
  bh = Math.max(8, Math.ceil((innerHeight || 600) / S));
  cvs.width = bw; cvs.height = bh;
  img = ctx.createImageData(bw, bh);
  glow = new Float32Array(bw * bh);
  neb = new Float32Array(bw * bh);
  const ph = Math.random() * 10;
  for (let y = 0; y < bh; y++)
    for (let x = 0; x < bw; x++) {
      let n = 0.5 + 0.28 * Math.sin(x * 0.029 + ph) * Math.cos(y * 0.024 - ph * 0.7) + 0.22 * Math.sin((x * 0.6 + y) * 0.017 + ph * 1.9);
      const dx = x / bw - 0.5, dy = y / bh - 0.5;
      neb[y * bw + x] = Math.max(0, n * n * (1 - (dx * dx + dy * dy) * 1.6));
    }
  const count = Math.max(34, Math.min(140, Math.round(bw * bh / 650)));
  nodes = [];
  for (let i = 0; i < count; i++) nodes.push(node(Math.random() * bw, Math.random() * bh, Math.random() * 0.3, Infinity));
  stars = [];
  for (let i = 0; i < bw * bh / 260; i++) stars.push({ i: (Math.random() * bh | 0) * bw + (Math.random() * bw | 0), b: 0.2 + Math.random() * 0.5, r: 0.5 + Math.random() * 2.5, p: Math.random() * 7 });
}
function burst(strength) {
  for (let k = 0; k < 6; k++) nodes.push(node(Math.random() * bw, Math.random() * bh, strength, 4 + Math.random() * 4));
}
function addLine(x0, y0, x1, y1, b) {
  x0 |= 0; y0 |= 0; x1 |= 0; y1 |= 0;
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  for (let guard = 0; guard < 400; guard++) {
    if (x0 >= 0 && y0 >= 0 && x0 < bw && y0 < bh) { const i = y0 * bw + x0; glow[i] = Math.min(1.6, glow[i] + b); }
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}
function step(dt) {
  time += dt;
  const target = Math.min(1, audioLevel() * 2.4);
  level += (target - level) * (target > level ? 0.5 : 0.06);
  let moved = false;
  for (let i = 0; i < 3; i++) { const d = tintTo[i] - tint[i]; if (Math.abs(d) > 0.5) { tint[i] += d * Math.min(1, dt * 3); moved = true; } }
  if (moved || !ramp.length) makeRamp();

  const speed = reduceMotion ? 0.25 : 1;
  for (const n of nodes) {
    const a = (Math.sin(n.x * 0.035 + time * 0.13) + Math.cos(n.y * 0.041 - time * 0.09)) * Math.PI;
    n.vx = (n.vx + Math.cos(a) * 7 * dt) * 0.975;
    n.vy = (n.vy + Math.sin(a) * 7 * dt) * 0.975;
    n.x += n.vx * dt * speed * (1 + level * 2.5);
    n.y += n.vy * dt * speed * (1 + level * 2.5);
    if (n.x < -4) n.x += bw + 8; if (n.x > bw + 4) n.x -= bw + 8;
    if (n.y < -4) n.y += bh + 8; if (n.y > bh + 4) n.y -= bh + 8;
    n.e *= Math.exp(-dt * 1.2);
    n.life -= dt;
  }
  nodes = nodes.filter(n => n.life > 0);
  if (level > 0.2 && Math.random() < level * 0.5 && nodes.length < 220)
    nodes.push(node(Math.random() * bw, Math.random() * bh, 0.6 + level * 0.4, 3 + Math.random() * 4));
}
function render(dt) {
  const keep = Math.exp(-dt * 5), f = 1 - keep;
  for (let i = 0; i < glow.length; i++) glow[i] *= keep;
  const maxD = 30 + level * 10, maxD2 = maxD * maxD;
  const n = nodes.length;
  for (let i = 0; i < n; i++) {
    const a = nodes[i];
    let b1 = -1, b2 = -1, d1 = maxD2, d2 = maxD2;
    for (let j = 0; j < n; j++) {
      if (j === i) continue;
      const dx = nodes[j].x - a.x, dy = nodes[j].y - a.y, d = dx * dx + dy * dy;
      if (d < d1) { d2 = d1; b2 = b1; d1 = d; b1 = j; } else if (d < d2) { d2 = d; b2 = j; }
    }
    for (const [j, d] of [[b1, d1], [b2, d2]]) {
      if (j < 0) continue;
      const b = nodes[j];
      const s = (0.22 + level * 0.6 + (a.e + b.e) * 0.45) * (1 - Math.sqrt(d) / maxD);
      addLine(a.x, a.y, b.x, b.y, s * f * 2.2);
    }
  }
  for (const a of nodes) {
    const x = a.x | 0, y = a.y | 0;
    if (x < 1 || y < 1 || x >= bw - 1 || y >= bh - 1) continue;
    const c = (0.9 + a.e) * f * 3;
    glow[y * bw + x] += c;
    if (a.e > 0.25 || level > 0.3) { glow[y * bw + x - 1] += c * 0.4; glow[y * bw + x + 1] += c * 0.4; glow[(y - 1) * bw + x] += c * 0.4; glow[(y + 1) * bw + x] += c * 0.4; }
  }
  for (const s of stars) {
    const v = s.b * (0.55 + 0.45 * Math.sin(time * s.r + s.p));
    if (glow[s.i] < v) glow[s.i] = v;
  }
  const data = img.data;
  const nebAmt = 0.16 + level * 0.12;
  for (let y = 0, i = 0, p = 0; y < bh; y++) {
    const by = (y & 3) * 4;
    for (let x = 0; x < bw; x++, i++, p += 4) {
      const v = glow[i] * 0.7 + neb[i] * nebAmt;
      let k = (v * 7 + BAYER[by + (x & 3)] - 0.5) | 0;
      if (k < 0) k = 0; else if (k > 7) k = 7;
      const c = ramp[k];
      data[p] = c[0]; data[p + 1] = c[1]; data[p + 2] = c[2]; data[p + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
}
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  acc += dt;
  if (acc >= 1 / 32) {
    step(acc);
    render(acc);
    tickMeters();
    acc = 0;
  }
  requestAnimationFrame(frame);
}
addEventListener("resize", () => { clearTimeout(resize.t); resize.t = setTimeout(resize, 150); });
addEventListener("pointerdown", e => {
  if (e.target.closest("a, button, summary, video")) return;
  const x = e.clientX / S, y = e.clientY / S;
  for (let k = 0; k < 4; k++) nodes.push(node(x + (Math.random() - 0.5) * 10, y + (Math.random() - 0.5) * 10, 1, 4 + Math.random() * 3));
});

// sticky buy bar once the hero button scrolls away
const stick = document.getElementById("stick");
new IntersectionObserver(([e]) => {
  const show = !e.isIntersecting && e.boundingClientRect.top < 0;
  stick.classList.toggle("show", show);
  stick.setAttribute("aria-hidden", String(!show));
  stick.querySelector("a").tabIndex = show ? 0 : -1;
}).observe(document.getElementById("heroBuy"));

document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang;
  try { localStorage.setItem("vw-lang", lang); } catch (e) {}
  stopDemo();
  buildCopy();
}));

wireBuy();
renderPixels();
buildCopy();
resize();
makeRamp();
requestAnimationFrame(frame);
</script>
</body>
</html>
